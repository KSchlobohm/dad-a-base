<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5a3e2b" />
  <title>Dad-A-Base</title>
  <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
</head>
<body>
  <div class="container">
    <h1>Dad-A-Base</h1>
    <div class="card" id="card" role="button" tabindex="0" aria-label="Reveal or hide punchline">
      <p id="setup-text"></p>
      <p id="punchline-text" class="punchline hidden"></p>
      <div id="joke-link-container"></div>
      <span class="hint">tap to reveal</span>
    </div>
    <div class="nav">
      <button class="nav-btn" id="back-button">&#8592; Back</button>
      <button class="nav-btn" id="next-button">Next &#8594;</button>
    </div>
  </div>
  <div id="update-banner" class="update-banner hidden" role="status">
    A new version is available.
    <button id="update-button" type="button">Update</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
